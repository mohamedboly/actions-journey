name: my_pipeline
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{steps.ver.outputs.version}}
    steps:
      - id: ver
        run: echo v1.2.3 >> $GITHUB_OUTPUT
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - run: echo test
  deploy:
    runs-on: ubuntu-latest
    needs: [build, test]
    steps:
      - run: echo ${{needs.build.outputs.version}}
